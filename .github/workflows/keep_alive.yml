name: Keep Render Alive & Refresh DB Cache (ALMT Business Hours)

on:
  schedule:
    # UTC 기준 00:00 ~ 15:59 (ALMT 05:00 ~ 20:59) 동안 12분마다 실행
    - cron: '*/12 0-15 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping & Refresh Cache
    runs-on: ubuntu-latest
    steps:
      - name: Refresh DB Cache & Keep Alive
        run: |
          # Supabase dashboard_cache 갱신 + Flask 캐시 재빌드 트리거
          # pg_cron 대체: GitHub Actions가 12분마다 캐시 갱신
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            https://ipcs-control.onrender.com/api/refresh-db-cache)
          echo "HTTP $STATUS"
          cat /tmp/resp.json
